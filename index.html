<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naiqo & Ollotechs — Contenido IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #E8007A; --purple: #7700CC; --dark: #0D0D1A; --card: #14142A;
      --border: #2A2A4A; --text: #E8E8F0; --muted: #8888AA;
      --naiqo: #E8007A; --ollotechs: #7700CC;
    }
    body { background: var(--dark); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 400px; text-align: center; }
    .login-logo { font-size: 28px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(135deg, var(--pink), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .login-sub { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
    .login-card input { width: 100%; background: var(--dark); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; color: var(--text); font-size: 16px; margin-bottom: 16px; outline: none; }
    #app { display: none; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header-logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, var(--pink), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-tabs { display: flex; gap: 4px; background: var(--dark); padding: 4px; border-radius: 10px; }
    .tab-btn { padding: 8px 18px; border-radius: 8px; border: none; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: var(--card); color: var(--text); }
    main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    .section-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    .section-title span { background: linear-gradient(135deg, var(--pink), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px; margin-bottom: 24px; }
    .form-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; display: block; }
    .brand-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .brand-btn { padding: 16px; border-radius: 14px; border: 2px solid var(--border); background: var(--dark); color: var(--muted); cursor: pointer; text-align: center; }
    .brand-btn .brand-name { font-size: 18px; font-weight: 800; letter-spacing: 2px; display: block; margin-bottom: 4px; }
    .brand-btn .brand-desc { font-size: 12px; }
    .brand-btn[data-brand="naiqo"].selected { border-color: var(--naiqo); background: rgba(232,0,122,0.08); color: var(--text); }
    .brand-btn[data-brand="naiqo"].selected .brand-name { color: var(--naiqo); }
    .brand-btn[data-brand="ollotechs"].selected { border-color: var(--ollotechs); background: rgba(119,0,204,0.08); color: var(--text); }
    .brand-btn[data-brand="ollotechs"].selected .brand-name { color: var(--ollotechs); }
    .format-selector { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .format-btn { padding: 14px 18px; border-radius: 12px; border: 2px solid var(--border); background: var(--dark); color: var(--muted); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; }
    .format-btn .format-emoji { font-size: 20px; flex-shrink: 0; }
    .format-btn .format-info .format-name { font-weight: 700; font-size: 15px; color: var(--text); display: block; margin-bottom: 2px; }
    .format-btn .format-info .format-desc { font-size: 12px; }
    .format-btn.selected { border-color: var(--purple); background: rgba(119,0,204,0.08); color: var(--text); }
    .idea-input { width: 100%; background: var(--dark); border: 2px solid var(--border); border-radius: 12px; padding: 16px 18px; color: var(--text); font-size: 16px; font-family: inherit; resize: vertical; min-height: 80px; outline: none; margin-bottom: 20px; }
    .idea-input::placeholder { color: var(--muted); }
    .btn-generate { width: 100%; padding: 18px; border-radius: 14px; border: none; background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; font-size: 17px; font-weight: 700; cursor: pointer; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
    #resultado { display: none; margin-top: 28px; }
    .resultado-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .resultado-titulo { font-size: 18px; font-weight: 700; }
    .marca-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .marca-badge.naiqo { background: rgba(232,0,122,0.15); color: var(--naiqo); }
    .marca-badge.ollotechs { background: rgba(119,0,204,0.15); color: #AA44FF; }
    .gancho-box { background: linear-gradient(135deg, rgba(232,0,122,0.1), rgba(119,0,204,0.1)); border: 1px solid rgba(119,0,204,0.3); border-radius: 16px; padding: 20px 24px; margin-bottom: 20px; }
    .gancho-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--purple); text-transform: uppercase; margin-bottom: 8px; }
    .gancho-text { font-size: 20px; font-weight: 700; line-height: 1.4; }
    .content-block { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; }
    .block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .block-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
    .copy-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
    .copy-btn.copied { border-color: #00CC77; color: #00CC77; }
    .block-text { font-size: 15px; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
    .hashtags-text { font-size: 13px; color: #AA88FF; line-height: 1.8; word-break: break-word; }
    .btn-guardar { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid var(--purple); background: transparent; color: var(--purple); font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn-guardar.guardado { border-color: #00CC77; color: #00CC77; }
    #tab-historial { display: none; }
    .filtros { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filtro-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
    .filtro-btn.active { background: var(--card); color: var(--text); border-color: var(--purple); }
    .historia-item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 14px; cursor: pointer; }
    .historia-item:hover { border-color: var(--purple); }
    .historia-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .historia-titulo { font-weight: 700; font-size: 15px; line-height: 1.3; }
    .estado-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .estado-idea { background: rgba(255,200,0,0.12); color: #FFD700; }
    .estado-guion { background: rgba(0,150,255,0.12); color: #4488FF; }
    .estado-grabado { background: rgba(255,100,0,0.12); color: #FF8844; }
    .estado-publicado { background: rgba(0,204,119,0.12); color: #00CC77; }
    .historia-gancho { font-size: 13px; color: var(--muted); margin-bottom: 12px; font-style: italic; }
    .historia-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .historia-fecha { font-size: 11px; color: var(--muted); }
    .estado-selector { display: flex; gap: 6px; flex-wrap: wrap; }
    .estado-btn { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; }
    .estado-btn.active-idea { border-color: #FFD700; color: #FFD700; background: rgba(255,200,0,0.08); }
    .estado-btn.active-guion { border-color: #4488FF; color: #4488FF; background: rgba(0,150,255,0.08); }
    .estado-btn.active-grabado { border-color: #FF8844; color: #FF8844; background: rgba(255,100,0,0.08); }
    .estado-btn.active-publicado { border-color: #00CC77; color: #00CC77; background: rgba(0,204,119,0.08); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s ease-in-out infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 100%; max-width: 700px; margin: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-close { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .delete-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,50,50,0.3); background: transparent; color: #FF5555; font-size: 13px; font-weight: 600; cursor: pointer; }
    @media (max-width: 600px) {
      .brand-selector { grid-template-columns: 1fr; }
      .header-tabs { display: none; }
      .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; padding: 12px 0 20px; z-index: 100; }
      .mobile-nav-btn { flex: 1; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .mobile-nav-btn.active { color: var(--purple); }
      .mobile-nav-btn .nav-icon { font-size: 22px; }
      main { padding-bottom: 90px; }
    }
    @media (min-width: 601px) { .mobile-nav { display: none; } }
  </style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">NAIQO</div>
    <div class="login-sub">Generador de contenido para redes sociales</div>
    <input type="password" id="password-input" placeholder="Contrasena" autocomplete="current-password">
    <button class="btn-generate" onclick="login()">Entrar</button>
  </div>
</div>
<div id="app">
  <header>
    <div class="header-logo">NAIQO x AI</div>
    <div class="header-tabs">
      <button class="tab-btn active" onclick="showTab('generar',this)">Generar</button>
      <button class="tab-btn" onclick="showTab('historial',this)">Historial</button>
    </div>
  </header>
  <main>
    <div id="tab-generar">
      <div class="section-title">Crear nuevo <span>contenido</span></div>
      <div class="form-card">
        <span class="form-label">1. Elige la marca</span>
        <div class="brand-selector">
          <button class="brand-btn" data-brand="naiqo" onclick="selectBrand('naiqo')">
            <span class="brand-name">NAIQO</span>
            <span class="brand-desc">IA para salones de unas</span>
          </button>
          <button class="brand-btn" data-brand="ollotechs" onclick="selectBrand('ollotechs')">
            <span class="brand-name">OLLOTECHS</span>
            <span class="brand-desc">Consultoria IA sector belleza</span>
          </button>
        </div>
        <span class="form-label">2. Elige el formato</span>
        <div class="format-selector">
          <button class="format-btn" data-formato="dolor" onclick="selectFormato('dolor')">
            <span class="format-emoji">&#x1F4B8;</span>
            <div class="format-info">
              <span class="format-name">"Esto te esta costando dinero"</span>
              <span class="format-desc">Revela un problema que el salon no sabe que tiene</span>
            </div>
          </button>
          <button class="format-btn" data-formato="demo" onclick="selectFormato('demo')">
            <span class="format-emoji">&#x1F916;</span>
            <div class="format-info">
              <span class="format-name">"Mira lo que hace la IA"</span>
              <span class="format-desc">Demuestra la tecnologia en accion, sin explicaciones largas</span>
            </div>
          </button>
          <button class="format-btn" data-formato="insight" onclick="selectFormato('insight')">
            <span class="format-emoji">&#x1F4A1;</span>
            <div class="format-info">
              <span class="format-name">"Lo que descubri trabajando con salones"</span>
              <span class="format-desc">Historia personal que genera autoridad y confianza</span>
            </div>
          </button>
        </div>
        <span class="form-label">3. Tu idea (en pocas palabras)</span>
        <textarea class="idea-input" id="idea-input" placeholder="Ej: Los salones pierden clientes porque no contestan WhatsApp fuera de horario..."></textarea>
        <button class="btn-generate" id="btn-generate" onclick="generar()">Generar contenido</button>
      </div>
      <div id="resultado">
        <div class="resultado-header">
          <div class="resultado-titulo" id="resultado-titulo">Contenido generado</div>
          <span class="marca-badge" id="resultado-marca-badge"></span>
        </div>
        <div class="gancho-box">
          <div class="gancho-label">Gancho - Primera frase del video</div>
          <div class="gancho-text" id="resultado-gancho"></div>
        </div>
        <div class="content-block">
          <div class="block-header"><span class="block-label">Guion del video</span><button class="copy-btn" onclick="copiar('resultado-guion',this)">Copiar</button></div>
          <div class="block-text" id="resultado-guion"></div>
        </div>
        <div class="content-block">
          <div class="block-header"><span class="block-label">Caption Instagram</span><button class="copy-btn" onclick="copiar('resultado-ig',this)">Copiar</button></div>
          <div class="block-text" id="resultado-ig"></div>
        </div>
        <div class="content-block">
          <div class="block-header"><span class="block-label">Caption TikTok</span><button class="copy-btn" onclick="copiar('resultado-tiktok',this)">Copiar</button></div>
          <div class="block-text" id="resultado-tiktok"></div>
        </div>
        <div class="content-block">
          <div class="block-header"><span class="block-label">Hashtags</span><button class="copy-btn" onclick="copiar('resultado-hashtags',this)">Copiar</button></div>
          <div class="hashtags-text" id="resultado-hashtags"></div>
        </div>
        <button class="btn-guardar" id="btn-guardar" onclick="guardarEnHistorial()">Guardar en historial</button>
      </div>
    </div>
    <div id="tab-historial">
      <div class="section-title">Tu <span>historial</span></div>
      <div class="filtros">
        <button class="filtro-btn active" onclick="filtrar('todo',this)">Todos</button>
        <button class="filtro-btn" onclick="filtrar('naiqo',this)">Naiqo</button>
        <button class="filtro-btn" onclick="filtrar('ollotechs',this)">Ollotechs</button>
        <button class="filtro-btn" onclick="filtrar('idea',this)">Idea</button>
        <button class="filtro-btn" onclick="filtrar('guion',this)">Guion</button>
        <button class="filtro-btn" onclick="filtrar('grabado',this)">Grabado</button>
        <button class="filtro-btn" onclick="filtrar('publicado',this)">Publicado</button>
      </div>
      <div id="historial-lista"></div>
    </div>
  </main>
  <nav class="mobile-nav">
    <button class="mobile-nav-btn active" onclick="showTab('generar',this,true)"><span class="nav-icon">&#10024;</span>Generar</button>
    <button class="mobile-nav-btn" onclick="showTab('historial',this,true)"><span class="nav-icon">&#x1F4CB;</span>Historial</button>
  </nav>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-card">
    <div class="modal-header">
      <div class="resultado-titulo" id="modal-titulo"></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="delete-btn" onclick="eliminarDesdeModal()">Eliminar</button>
        <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">x</button>
      </div>
    </div>
    <div id="modal-content"></div>
  </div>
</div>
<script>
  var selectedBrand=null,selectedFormato=null,currentContent=null,filtroActual='todo',modalItemId=null;
  var historial=JSON.parse(localStorage.getItem('naiqo_historial')||'[]');
  var savedPassword=localStorage.getItem('naiqo_pass')||'';
  function login(){var p=document.getElementById('password-input').value;if(!p)return;savedPassword=p;localStorage.setItem('naiqo_pass',p);document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';renderHistorial();}
  if(savedPassword){document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';renderHistorial();}
  document.getElementById('password-input').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
  function showTab(tab,btn,mobile){document.getElementById('tab-generar').style.display=tab==='generar'?'block':'none';document.getElementById('tab-historial').style.display=tab==='historial'?'block':'none';if(mobile){document.querySelectorAll('.mobile-nav-btn').forEach(function(b){b.classList.remove('active')});}else{document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});}btn.classList.add('active');if(tab==='historial')renderHistorial();}
  function selectBrand(b){selectedBrand=b;document.querySelectorAll('.brand-btn').forEach(function(x){x.classList.remove('selected')});document.querySelector('[data-brand="'+b+'"]').classList.add('selected');}
  function selectFormato(f){selectedFormato=f;document.querySelectorAll('.format-btn').forEach(function(x){x.classList.remove('selected')});document.querySelector('[data-formato="'+f+'"]').classList.add('selected');}
  async function generar(){
    var idea=document.getElementById('idea-input').value.trim();
    if(!selectedBrand){alert('Elige una marca');return;}
    if(!selectedFormato){alert('Elige un formato');return;}
    if(!idea){alert('Escribe tu idea');return;}
    var btn=document.getElementById('btn-generate');
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Generando...';
    document.getElementById('resultado').style.display='none';
    try{
      var res=await fetch('/api/generar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({marca:selectedBrand,formato:selectedFormato,idea:idea,password:savedPassword})});
      var data=await res.json();
      if(!data.ok){if(res.status===401){alert('Contrasena incorrecta');localStorage.removeItem('naiqo_pass');}else{alert('Error: '+data.error);}return;}
      currentContent=data.content;mostrarResultado(data.content);
    }catch(e){alert('Error: '+e.message);}
    finally{btn.disabled=false;btn.innerHTML='Generar contenido';}
  }
  function mostrarResultado(c){
    document.getElementById('resultado-titulo').textContent=c.titulo_contenido||'Contenido generado';
    var badge=document.getElementById('resultado-marca-badge');badge.textContent=c.marca==='naiqo'?'NAIQO':'OLLOTECHS';badge.className='marca-badge '+c.marca;
    document.getElementById('resultado-gancho').textContent=c.gancho;
    document.getElementById('resultado-guion').textContent=c.guion;
    document.getElementById('resultado-ig').textContent=c.caption_ig;
    document.getElementById('resultado-tiktok').textContent=c.caption_tiktok;
    document.getElementById('resultado-hashtags').textContent=c.hashtags;
    document.getElementById('btn-guardar').textContent='Guardar en historial';
    document.getElementById('btn-guardar').className='btn-guardar';
    document.getElementById('resultado').style.display='block';
    document.getElementById('resultado').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function copiar(id,btn){navigator.clipboard.writeText(document.getElementById(id).textContent).then(function(){btn.textContent='Copiado';btn.classList.add('copied');setTimeout(function(){btn.textContent='Copiar';btn.classList.remove('copied');},2000);});}
  function guardarEnHistorial(){if(!currentContent)return;if(!historial.find(function(h){return h.id===currentContent.id;})){historial.unshift(Object.assign({},currentContent,{estado:'idea'}));}localStorage.setItem('naiqo_historial',JSON.stringify(historial));var btn=document.getElementById('btn-guardar');btn.textContent='Guardado';btn.classList.add('guardado');}
  var ESTADOS=[{key:'idea',label:'Idea',cls:'active-idea'},{key:'guion',label:'Guion listo',cls:'active-guion'},{key:'grabado',label:'Grabado',cls:'active-grabado'},{key:'publicado',label:'Publicado',cls:'active-publicado'}];
  function renderHistorial(){
    var lista=document.getElementById('historial-lista');
    var items=historial.slice();
    if(filtroActual==='naiqo')items=items.filter(function(i){return i.marca==='naiqo';});
    else if(filtroActual==='ollotechs')items=items.filter(function(i){return i.marca==='ollotechs';});
    else if(['idea','guion','grabado','publicado'].indexOf(filtroActual)>=0)items=items.filter(function(i){return i.estado===filtroActual;});
    if(items.length===0){lista.innerHTML='<div class="empty-state"><div class="empty-icon">&#x1F4ED;</div><p>No hay contenido guardado todavia</p></div>';return;}
    var eClasses={idea:'estado-idea',guion:'estado-guion',grabado:'estado-grabado',publicado:'estado-publicado'};
    var eLabels={idea:'Idea',guion:'Guion',grabado:'Grabado',publicado:'Publicado'};
    lista.innerHTML=items.map(function(item){
      var fecha=new Date(item.fecha).toLocaleDateString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      var eBtns=ESTADOS.map(function(e){return '<button class="estado-btn '+(item.estado===e.key?e.cls:'')+'" onclick="cambiarEstado('+item.id+',''+e.key+'',event)">'+e.label+'</button>';}).join('');
      return '<div class="historia-item" onclick="abrirDetalle('+item.id+')"><div class="historia-item-header"><div><span class="marca-badge '+item.marca+'" style="margin-bottom:6px;display:inline-block">'+item.marca.toUpperCase()+'</span><div class="historia-titulo">'+(item.titulo_contenido||item.idea)+'</div></div><span class="estado-badge '+(eClasses[item.estado]||'estado-idea')+'">'+(eLabels[item.estado]||item.estado)+'</span></div><div class="historia-gancho">"'+item.gancho+'"</div><div class="historia-footer"><span class="historia-fecha">'+fecha+'</span><div class="estado-selector" onclick="event.stopPropagation()">'+eBtns+'</div></div></div>';
    }).join('');
  }
  function cambiarEstado(id,estado,event){event.stopPropagation();var item=historial.find(function(h){return h.id===id;});if(item){item.estado=estado;localStorage.setItem('naiqo_historial',JSON.stringify(historial));renderHistorial();}}
  function filtrar(tipo,btn){filtroActual=tipo;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');renderHistorial();}
  function abrirDetalle(id){
    var item=historial.find(function(h){return h.id===id;});if(!item)return;modalItemId=id;
    document.getElementById('modal-titulo').textContent=item.titulo_contenido||item.idea;
    function blk(label,text,bid){return '<div class="content-block"><div class="block-header"><span class="block-label">'+label+'</span><button class="copy-btn" onclick="copiar(''+bid+'',this)">Copiar</button></div><div class="block-text" id="'+bid+'">'+text+'</div></div>';}
    document.getElementById('modal-content').innerHTML='<div class="gancho-box" style="margin-bottom:16px"><div class="gancho-label">Gancho</div><div class="gancho-text">'+item.gancho+'</div></div>'+blk('Guion',item.guion,'modal-guion')+blk('Caption Instagram',item.caption_ig,'modal-ig')+blk('Caption TikTok',item.caption_tiktok,'modal-tiktok')+'<div class="content-block"><div class="block-header"><span class="block-label">Hashtags</span><button class="copy-btn" onclick="copiar('modal-hashtags',this)">Copiar</button></div><div class="hashtags-text" id="modal-hashtags">'+item.hashtags+'</div></div>';
    document.getElementById('modal-overlay').classList.add('open');
  }
  function closeModal(e){if(e.target===document.getElementById('modal-overlay'))document.getElementById('modal-overlay').classList.remove('open');}
  function eliminarDesdeModal(){if(!modalItemId)return;if(!confirm('Eliminar?'))return;historial=historial.filter(function(h){return h.id!==modalItemId;});localStorage.setItem('naiqo_historial',JSON.stringify(historial));document.getElementById('modal-overlay').classList.remove('open');renderHistorial();}
</script>
</body>
</html>
